name: Validate site and data collector

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Extract all inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          for index, page in enumerate(sorted(Path(".").rglob("*.html"))):
              html = page.read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S)
              scripts = [script for script in scripts if script.strip()]
              if scripts:
                  Path(f"/tmp/site-{index}.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
      - name: Check all JavaScript syntax
        run: |
          for script in /tmp/site-*.js; do
            node --check "$script"
          done
          node --check sw.js
      - name: Compile Python collector, audit and tests
        run: python3 -m py_compile scripts/archive_market_data.py scripts/test_archive_market_data.py scripts/update_cmc_cache.py scripts/site_audit.py
      - name: Run offline collector tests
        run: python3 -m unittest scripts.test_archive_market_data -v
      - name: Run 100-check site audit
        run: python3 scripts/site_audit.py
      - name: Validate sitemap XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"
