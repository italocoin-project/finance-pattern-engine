name: Archive public exchange market data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-market-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Collect public spot prices
        run: python3 scripts/archive_market_data.py
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market
          if git diff --cached --quiet; then
            echo "No archive changes"
            exit 0
          fi
          git commit -m "Archive public exchange prices $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
